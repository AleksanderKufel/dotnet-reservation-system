name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ReservationSystem

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ReservationSystem.slnx

      - name: Build
        run: dotnet build ReservationSystem.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ReservationSystem.UnitTests --configuration Release --no-build

      - name: Run integration tests
        run: dotnet test ReservationSystem.IntegrationTests --configuration Release --no-build --filter "Category!=External"
