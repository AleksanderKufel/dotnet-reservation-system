name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ReservationSystem

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reservationdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservationdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=reservationdb;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore ReservationSystem.slnx
          dotnet tool restore

      - name: Build
        run: dotnet build ReservationSystem.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ReservationSystem.UnitTests --configuration Release --no-build

      - name: Apply migrations
        run: dotnet ef database update --project ReservationSystem.Infrastructure --startup-project ReservationSystem.API --configuration Release --no-build

      - name: Run integration tests
        run: dotnet test ReservationSystem.IntegrationTests --configuration Release --no-build
