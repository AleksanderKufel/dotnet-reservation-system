name: Build and deploy ASP.Net Core app to Azure Web App - reservation-system-api-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ReservationSystem/ReservationSystem.slnx

      - name: Build
        run: dotnet build ReservationSystem/ReservationSystem.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ReservationSystem/ReservationSystem.UnitTests/ReservationSystem.UnitTests.csproj \
            --configuration Release \
            --no-build

      - name: Publish API
        run: dotnet publish ReservationSystem/ReservationSystem.API/ReservationSystem.Api.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1E99C1C8EBD54A6E82E11244E7408FC9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2C57B0BC53E74023966252148BB2A164 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7DE41E02C45145499FEB30839D41C98F }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: reservation-system-api-dev
          package: publish